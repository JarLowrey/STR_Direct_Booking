name: Update Combined Calendar

on:
  schedule:
    # Run every 2 hours = 12 times per day
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Lets this workflow start a site's deploy after committing a changed calendar.
  actions: write

jobs:
  sites:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: List sites
        id: list
        run: echo "matrix=$(node scripts/sites.mjs matrix)" >> "$GITHUB_OUTPUT"

  update-calendar:
    needs: sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One site at a time, so their commits don't race each other.
      max-parallel: 1
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.matrix) }}
    name: update-calendar (${{ matrix.site.id }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download and combine calendars
        id: calendar
        env:
          # The site's feed URLs (they contain private tokens), from the secret named in its config.
          CALENDAR_FEEDS: ${{ secrets[matrix.site.calendarSecret] }}
        run: |
          # A site without its secret yet has no calendar; its page leaves availability out.
          if [ -z "$CALENDAR_FEEDS" ]; then
            echo "::warning::Skipping ${{ matrix.site.id }}: add the ${{ matrix.site.calendarSecret }} secret to show its availability (see README)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/update-calendar.mjs ${{ matrix.site.id }}

      - name: Commit combined calendar
        id: commit
        if: steps.calendar.outputs.skipped != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/${{ matrix.site.id }}/data/combined_calendar.json

          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update combined calendar for ${{ matrix.site.id }}"
            # Another workflow may have pushed since checkout.
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy directly.
      - name: Rebuild and deploy ${{ matrix.site.id }}
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f site=${{ matrix.site.id }}
