name: Update Airbnb Images

on:
  schedule:
    # Run monthly at 9:30 AM PST on the first day (GitHub Actions uses UTC).
    - cron: "30 17 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  # Lets this workflow start a site's deploy after committing its new photos.
  actions: write

jobs:
  sites:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: List sites
        id: list
        run: echo "matrix=$(node scripts/sites.mjs matrix)" >> "$GITHUB_OUTPUT"

  update-images:
    needs: sites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # One site at a time, so their commits don't race each other.
      max-parallel: 1
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.matrix) }}
    name: update-images (${{ matrix.site.id }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (including Playwright and sharp)
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Pull all Airbnb listing photos and metadata
        run: node scripts/fetch-airbnb-images.mjs ${{ matrix.site.id }}

      - name: Commit photos
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/${{ matrix.site.id }}/public/images/airbnb_images sites/${{ matrix.site.id }}/public/images/airbnb_thumbnails

          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Update Airbnb listing photos for ${{ matrix.site.id }}"
            # Another workflow may have pushed since checkout.
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy directly.
      - name: Rebuild and deploy ${{ matrix.site.id }}
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f site=${{ matrix.site.id }}
